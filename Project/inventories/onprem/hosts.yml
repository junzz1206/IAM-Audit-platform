all:
  children:

    # ------------------------------------------------------
    # Database Servers
    # ------------------------------------------------------
    db_servers:
      hosts:
        onprem-master:
          ansible_host: 192.168.223.128   # 실제 DB 서버 IP
          ansible_user: rocky             # SSH 접속 계정
          ansible_connection: ssh         # SSH 사용

    # ------------------------------------------------------
    # Kubernetes Control Plane
    # ------------------------------------------------------
    k8s_control_plane:
      hosts:
        onprem-master:
          ansible_host: 192.168.223.128   # control-plane 노드 IP
          ansible_user: rocky
          ansible_connection: ssh

    # ------------------------------------------------------
    # Kubernetes Worker Nodes
    # ------------------------------------------------------
    k8s_workers:
      hosts: {}

    # ------------------------------------------------------
    # Kubernetes All Nodes (공통 작업용)
    # ------------------------------------------------------
    k8s_nodes:
      children:
        k8s_control_plane: {}
        k8s_workers: {}

