# ==========================================================
# Ansible Configuration File
# Project scope: On-Premise Infrastructure & Applications
# 위치: Project/ansible.cfg
# ==========================================================

[defaults]
# ----------------------------------------------------------
# roles 디렉터리 경로
# - Project/roles 를 명시적으로 role 검색 경로로 지정
# - playbooks 하위에서 include_role 사용 시에도 인식되도록 함
# ----------------------------------------------------------
roles_path = ./roles

# ----------------------------------------------------------
# inventory 기본 경로
# - 실행 시 -i 옵션을 주지 않아도 기본 인벤토리로 사용 가능
# - 필요 시 실행 옵션으로 덮어쓸 수 있음
# ----------------------------------------------------------
inventory = ./inventories/onprem/hosts.yml

# ----------------------------------------------------------
# 호스트 키 체크 비활성화
# - 온프레미스 초기 구축 단계에서 SSH 경고 방지
# - 운영 환경에서는 보안 정책에 따라 재검토 필요
# ----------------------------------------------------------
host_key_checking = False

# ----------------------------------------------------------
# Python 인터프리터 자동 감지
# - Rocky Linux 9 기준 python3 사용
# ----------------------------------------------------------
interpreter_python = auto_silent

# ----------------------------------------------------------
# 경고 최소화
# - deprecation 경고로 인한 출력 노이즈 제거
# ----------------------------------------------------------
deprecation_warnings = False


[privilege_escalation]
# ----------------------------------------------------------
# become 설정
# - 기본적으로 비활성화
# - 필요 시 playbook / role 단에서 명시적으로 사용
# ----------------------------------------------------------
become = False

