# ==========================================================
# src/main/resources/application.yml
# (IAM Service / Spring Boot)
# ==========================================================

spring:
  application:
    name: iam-service

  profiles:
    active: onprem

  # --------------------------------------------------------
  # Datasource (PostgreSQL)
  # ※ 모든 민감정보는 Kubernetes Secret / ENV에서 주입
  # --------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}              # ✅ iam_app_user (LOGIN USER)
    password: ${DB_PASSWORD}          # ✅ Secret에서 주입
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      initialization-fail-timeout: -1

# ----------------------------------------------------------
# Actuator / Health / Probes
# ----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true

# ----------------------------------------------------------
# Server
# ----------------------------------------------------------
server:
  port: 8080

