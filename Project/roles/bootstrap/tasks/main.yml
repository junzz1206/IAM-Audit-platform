---
# ==========================================================
# Bootstrap: Gradle / Spring Boot Build Environment
# ==========================================================

- name: Install Java & build dependencies
  dnf:
    name:
      - java-17-openjdk
      - java-17-openjdk-devel
      - unzip
      - curl
      - tar
      - git
    state: present

- name: Ensure JAVA_HOME is set
  lineinfile:
    path: /etc/profile.d/java.sh
    create: true
    line: 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk'

