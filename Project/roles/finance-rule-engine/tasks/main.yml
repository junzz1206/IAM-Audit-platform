---
# ==========================================================
# Role: finance-rule-engine
#
# 목적:
# - 회계 / 규칙 평가 엔진을 Kubernetes에 배포
# - 민감한 금융 데이터 조회
# - 규칙 평가 수행
# - 검증 결과 + 감사 이벤트 DB 기록
#
# 설계 원칙:
# - Namespace는 SSOT(group_vars/all.yml)에서만 정의
# - 이 role에서는 apps_namespace를 참조만 한다
# ==========================================================


# ----------------------------------------------------------
# 1. Rule Engine용 애플리케이션 Namespace 보장
# ----------------------------------------------------------
- name: Ensure application namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ apps_namespace }}"
  tags:
    - finance
    - namespace


# ----------------------------------------------------------
# 2. Rule Engine DB Secret 배포  🔥 (누락돼 있던 핵심)
# ----------------------------------------------------------
- name: Deploy rule engine DB Secret
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/k8s/secret.yml"
  tags:
    - finance
    - secret


# ----------------------------------------------------------
# 3. Rule Engine ConfigMap 배포
# ----------------------------------------------------------
- name: Deploy rule engine ConfigMap
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/k8s/configmap.yml"
  tags:
    - finance
    - configmap


# ----------------------------------------------------------
# 4. Rule Engine Deployment 배포
# ----------------------------------------------------------
- name: Deploy rule engine Deployment
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/k8s/deployment.yml"
  tags:
    - finance
    - deployment

