---
# ==========================================================
# PostgreSQL Role & Privilege Task (DCL)
#
# 역할:
# - ROLE 생성 (NOLOGIN)
# - GRANT / REVOKE
# - DEFAULT PRIVILEGES 설정
#
# 실행 정책:
# - postgres_roles_apply_enabled=true 일 때만 실행
# - 애플리케이션 DB 존재 필수
# - FAIL-FAST (ignore_errors 금지)
# ==========================================================

# ----------------------------------------------------------
# 0. 실행 가드 (명시적 enable 필수)
# ----------------------------------------------------------
- name: Ensure PostgreSQL role apply is explicitly enabled
  assert:
    that:
      - postgres_roles_apply_enabled | bool
    fail_msg: >
      PostgreSQL role/privilege apply is disabled.
      Set postgres_roles_apply_enabled=true to proceed.
  tags:
    - postgres
    - dcl
    - guard


# ----------------------------------------------------------
# 1. PostgreSQL 서비스 기동 보장
# ----------------------------------------------------------
- name: Ensure PostgreSQL service is running
  systemd:
    name: "{{ postgres_service_name }}"   # ex) postgresql-15
    state: started
  become: true
  tags:
    - postgres
    - service


# ----------------------------------------------------------
# 2. 애플리케이션 DB 존재 확인 (DCL은 DB 필수)
# ----------------------------------------------------------
- name: Verify application database exists
  become_user: postgres
  command: >
    psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ postgres_app_db }}'"
  register: db_exists
  changed_when: false
  tags:
    - postgres
    - dcl

- name: Abort if application database does not exist
  fail:
    msg: "Database {{ postgres_app_db }} does not exist. Aborting DCL."
  when: db_exists.stdout.strip() != "1"
  tags:
    - postgres
    - dcl


# ----------------------------------------------------------
# 3. SQL 스테이징 디렉터리 보안 보장
# ----------------------------------------------------------
- name: Ensure SQL directory exists on DB host
  file:
    path: "{{ postgres_sql_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  become: true
  tags:
    - postgres
    - filesystem


# ----------------------------------------------------------
# 4. DCL SQL 파일 배포
# ----------------------------------------------------------
- name: Deploy DCL SQL file
  copy:
    src: dcl.sql
    dest: "{{ postgres_sql_dir }}/dcl.sql"
    owner: postgres
    group: postgres
    mode: "0600"
  become: true
  tags:
    - postgres
    - dcl
    - sql


# ----------------------------------------------------------
# 5. DCL SQL 실행 (ROLE / GRANT / DEFAULT PRIVILEGES)
# ----------------------------------------------------------
- name: Execute DCL SQL (roles and privileges)
  become_user: postgres
  command: >
    /usr/pgsql-{{ postgres_version }}/bin/psql
    -v ON_ERROR_STOP=1
    -d {{ postgres_app_db }}
    -f {{ postgres_sql_dir }}/dcl.sql
  tags:
    - postgres
    - dcl
    - execute

