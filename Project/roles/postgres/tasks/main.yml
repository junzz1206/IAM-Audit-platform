---
# ==========================================================
# PostgreSQL Role - Main Task Entry
#
# 역할:
# - postgres role의 실행 흐름을 제어하는 메인 엔트리
# - 실제 작업은 install / init / roles 단계로 위임
#
# 설계 원칙:
# - 설치/초기화는 bootstrap 모드에서만 수행
# - 스키마/테이블 생성은 schema init 단계에서만 수행
# - 구조 진화(DDL)와 권한(DCL)은 명확히 분리
# - 접근 제어(pg_hba.conf)는 항상 최신 상태 유지
# ==========================================================


# ----------------------------------------------------------
# 0. Bootstrap 플래그 존재 여부 검증
# ----------------------------------------------------------
- name: Assert postgres_bootstrap_enabled is defined
  assert:
    that:
      - postgres_bootstrap_enabled is not none
    fail_msg: >
      postgres_bootstrap_enabled must be defined (true/false).
  tags:
    - postgres
    - guard


# ----------------------------------------------------------
# 1. PostgreSQL 설치 / initdb (최초 1회)
# ----------------------------------------------------------
- import_tasks: install.yml
  when: postgres_bootstrap_enabled | bool
  tags:
    - postgres
    - bootstrap
    - install


# ----------------------------------------------------------
# 2. DB 생성 + SCHEMA / TABLE 초기화 (DDL - schema.sql)
# ----------------------------------------------------------
- import_tasks: init.yml
  when: postgres_schema_init_enabled | bool
  tags:
    - postgres
    - ddl
    - schema
    - init


# ----------------------------------------------------------
# 3. ROLE / GRANT / DEFAULT PRIVILEGES (DCL)
# ----------------------------------------------------------
- import_tasks: roles.yml
  when: postgres_roles_apply_enabled | bool
  tags:
    - postgres
    - dcl
    - roles


# ----------------------------------------------------------
# 4. pg_hba.conf 반영 (항상 최신 상태 유지)
# ----------------------------------------------------------
- name: Apply pg_hba.conf (access control rules)
  template:
    src: pg_hba.conf.j2
    dest: "{{ postgres_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  become: true
  notify: Reload PostgreSQL
  tags:
    - postgres
    - hba


# ----------------------------------------------------------
# 5. PostgreSQL 서비스 기동 보장
# ----------------------------------------------------------
- name: Ensure PostgreSQL service is running
  systemd:
    name: "{{ postgres_service_name }}"
    state: started
    enabled: true
  become: true
  tags:
    - postgres
    - service

