apiVersion: apps/v1
kind: Deployment

metadata:
  name: ingest-service
  namespace: "{{ apps_namespace }}"
  labels:
    app: ingest-service

spec:
  # --------------------------------------------------
  # Replica count (반드시 int)
  # --------------------------------------------------
  replicas: {{ csv_ingest_replicas | int }}

  selector:
    matchLabels:
      app: ingest-service

  template:
    metadata:
      labels:
        app: ingest-service

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: ingest-service
          image: "{{ csv_ingest_image }}"
          imagePullPolicy: IfNotPresent

          # --------------------------------------------------
          # Container ports (반드시 int)
          # --------------------------------------------------
          ports:
            - containerPort: {{ csv_ingest_port | int }}

          # --------------------------------------------------
          # Resource limits / requests
          # --------------------------------------------------
          resources:
            requests:
              cpu: "{{ csv_ingest_cpu_request }}"
              memory: "{{ csv_ingest_memory_request }}"
            limits:
              cpu: "{{ csv_ingest_cpu_limit }}"
              memory: "{{ csv_ingest_memory_limit }}"

          securityContext:
            readOnlyRootFilesystem: true

          # --------------------------------------------------
          # Environment variables (모두 string)
          # --------------------------------------------------
          env:
            - name: DB_HOST
              value: "{{ db_host }}"

            - name: DB_PORT
              value: "{{ db_port | string }}"

            - name: DB_NAME
              value: "{{ db_name }}"

            - name: DB_USER
              value: "{{ ingest_db_user }}"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ ingest_db_secret_name }}"
                  key: password

            - name: DB_FINANCE_SCHEMA
              value: "finance"

            - name: DB_RAW_TX_TABLE
              value: "card_transactions_raw"

            - name: DB_AUDIT_SCHEMA
              value: "audit"

            - name: DB_AUDIT_TABLE
              value: "audit_events"

            - name: CSV_INGEST_PATH
              value: "{{ csv_ingest_nfs_path }}"

          # --------------------------------------------------
          # Volume mounts
          # --------------------------------------------------
          volumeMounts:
            - name: csv-storage
              mountPath: "{{ csv_ingest_nfs_path }}"
              readOnly: true

          # --------------------------------------------------
          # Readiness probe
          # --------------------------------------------------
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "test -r {{ csv_ingest_nfs_path }}"
            initialDelaySeconds: 5
            periodSeconds: 10

      # --------------------------------------------------
      # Volumes
      # --------------------------------------------------
      volumes:
        - name: csv-storage
          persistentVolumeClaim:
            claimName: "{{ nfs_pvc_name }}"

