---
# audit-relay/tasks/deploy.yml
# ==========================================================
# Audit Relay 배포 태스크
# - Jar 빌드 완료된 상태에서 이미지 생성
# - containerd에 import
# - Kubernetes Secret → ServiceAccount → Deployment 순서
# ==========================================================

- name: Ensure /tmp directory for manifests exists
  file:
    path: /tmp/audit-relay
    state: directory

# ----------------------------------------------------------
# 1️⃣ Docker 이미지 빌드
# ----------------------------------------------------------
- name: Build audit-relay Docker image
  community.docker.docker_image:
    build:
      path: "{{ role_path }}/files"
      dockerfile: Dockerfile
    name: "{{ audit_relay_image }}"
    tag: "{{ audit_relay_image_tag }}"
    push: no

# ----------------------------------------------------------
# 2️⃣ Docker 이미지 tar로 저장
# ----------------------------------------------------------
- name: Save audit-relay Docker image as tar
  command: >
    podman save -o /tmp/audit-relay-{{ audit_relay_image_tag }}.tar
    {{ audit_relay_image }}:{{ audit_relay_image_tag }}
  args:
    creates: "/tmp/audit-relay-{{ audit_relay_image_tag }}.tar"

# ----------------------------------------------------------
# 3️⃣ containerd import
# ----------------------------------------------------------
- name: Import audit-relay image into containerd
  command: >
    ctr -n {{ containerd_namespace }} images import
    /tmp/audit-relay-{{ audit_relay_image_tag }}.tar

# ----------------------------------------------------------
# 4️⃣ Kubernetes Secret (이미지 풀용, 필요시)
# ----------------------------------------------------------
- name: Deploy audit-relay Secret
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/k8s/secret.yml.j2') | from_yaml }}"

# ----------------------------------------------------------
# 5️⃣ Kubernetes ServiceAccount
# ----------------------------------------------------------
- name: Deploy audit-relay ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/k8s/serviceaccount.yml.j2') | from_yaml }}"

# ----------------------------------------------------------
# 6️⃣ Kubernetes Deployment
# ----------------------------------------------------------
- name: Deploy audit-relay Deployment
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/k8s/deployment.yml.j2') | from_yaml }}"

