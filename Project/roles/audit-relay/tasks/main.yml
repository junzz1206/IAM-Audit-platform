---
# ==========================================================
# Audit Relay Role - Main Task (수정 완료, namespace 치환 포함)
# ==========================================================

# ----------------------------------------------------------
# 0. Guard
# ----------------------------------------------------------
- name: Check if audit-relay service is enabled
  ansible.builtin.assert:
    that:
      - audit_relay_enabled | default(true) | bool
    fail_msg: "audit_relay_enabled=false, 배포 중단"
  tags:
    - audit_relay
    - guard

# ----------------------------------------------------------
# 1. Namespace 보장
# ----------------------------------------------------------
- name: Ensure audit-relay namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ audit_relay_namespace }}"
  delegate_to: localhost
  run_once: true
  tags:
    - audit_relay
    - namespace

# ----------------------------------------------------------
# 2. Secret 적용 (DB / OpenSearch 접속 정보)
#    - Deployment 생성 전에 반드시 존재
# ----------------------------------------------------------
- name: Apply audit-relay DB/OpenSearch Secret
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_relay_namespace }}"
    template: "{{ role_path }}/k8s/secret.yml.j2"
  delegate_to: localhost
  run_once: true
  tags:
    - audit_relay
    - secret

# ----------------------------------------------------------
# 3. ServiceAccount 생성
# ----------------------------------------------------------
- name: Deploy audit-relay ServiceAccount
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_relay_namespace }}"
    template: "{{ role_path }}/k8s/serviceaccount.yml.j2"
  delegate_to: localhost
  run_once: true
  tags:
    - audit_relay
    - serviceaccount
# ----------------------------------------------------------
# 4. 기존 Deployment 제거
#    - strategy 문제 방지 및 깨끗한 재배포
# ----------------------------------------------------------
- name: Cleanup audit-relay Deployment (force clean)
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: audit-relay
    namespace: "{{ audit_relay_namespace }}"
  delegate_to: localhost
  run_once: true
  ignore_errors: true
  tags:
    - audit_relay
    - cleanup

# ----------------------------------------------------------
# 5. Deployment 생성 (타입 안전)
# ----------------------------------------------------------
- name: Deploy audit-relay worker
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_relay_namespace }}"
    template: "{{ role_path }}/k8s/deployment.yml.j2"
  delegate_to: localhost
  run_once: true
  tags:
    - audit_relay
    - deployment

# ----------------------------------------------------------
# 6. Pod Ready 대기
# ----------------------------------------------------------
- name: Wait for audit-relay Pod to become Ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ audit_relay_namespace }}"
    label_selectors:
      - "app=audit-relay"
  register: audit_relay_pods
  until:
    - audit_relay_pods.resources | length > 0
    - audit_relay_pods.resources[0].status.containerStatuses is defined
    - audit_relay_pods.resources[0].status.containerStatuses | length > 0
    - audit_relay_pods.resources[0].status.containerStatuses[0].ready | default(false)
  retries: 30
  delay: 5
  delegate_to: localhost
  run_once: true
  tags:
    - audit_relay
    - wait

