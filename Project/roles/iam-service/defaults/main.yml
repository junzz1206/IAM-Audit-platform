---
# ==========================================================
# roles/iam-service/defaults/main.yml
#
# 목적:
# - iam-service Role의 최소 실행을 보장하는 기본 변수 정의
# - Ansible 변수 우선순위상 가장 낮은 단계(defaults)
#
# 설계 원칙:
# - 보안 민감 정보는 절대 포함하지 않음
# - 환경 의존 값(IP, 비밀번호 등)은 외부에서 주입
# - Role 단독 테스트가 가능하도록 안전한 fallback 제공
# ==========================================================


# ----------------------------------------------------------
# Kubernetes 기본 설정
# ----------------------------------------------------------

# IAM 서비스가 배포될 Namespace
# playbook / group_vars 에서 자유롭게 override 가능
iam_namespace: onprem-iam


# ----------------------------------------------------------
# IAM 서비스 이미지 설정
# ----------------------------------------------------------

# Kubernetes Deployment에서 참조하는 기본 이미지 이름
# ⚠️ 실제 운영에서는 group_vars 에서 반드시 override 권장
iam_service_image: iam-service:latest

# 이미지 빌드 도구
# - podman : on-prem / rootless 환경 권장
# - docker : docker runtime 사용 시
image_build_tool: podman

# 로컬 이미지 빌드 활성화 여부
# true  : 이미지 없으면 build_image.yml 실행
# false : 외부 레지스트리 사용 전제
local_image_build_enabled: true

# containerd 이미지 로드 활성화 여부
# true  : ctr image import 수행
# false : imagePullPolicy 기반 배포
local_image_load_enabled: true


# ----------------------------------------------------------
# containerd 설정
# ----------------------------------------------------------

# kubelet이 사용하는 containerd namespace
# 대부분의 Kubernetes 환경에서 k8s.io
containerd_namespace: k8s.io

# 이미지 tar 임시 경로
# load_image.yml에서 ctr import 시 사용
iam_image_tar: /tmp/iam-service.tar


# ----------------------------------------------------------
# DB Secret 기본 설정
# ----------------------------------------------------------

# Kubernetes Secret 이름
# ⚠️ secret.yml / deployment.yml 과 반드시 일치해야 함
iam_db_secret_name: iam-db-secret

# ⚠️ 중요
# - Secret "key" 이름(DB_PASSWORD 등)은
#   defaults / group_vars 에서 정의하지 않음
# - key는 secret.yml에서 고정 문자열로 관리
# - 이 Role에서는 key 개념을 아예 노출하지 않음


# ----------------------------------------------------------
# 재배포 제어 옵션
# ----------------------------------------------------------

# true  : cleanup.yml 실행 후 강제 재배포
# false : 기존 리소스 유지
force_redeploy: false

