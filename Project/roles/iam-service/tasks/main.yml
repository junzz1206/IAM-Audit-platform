# ==========================================================
# roles/iam-service/tasks/main.yml
#
# [역할 개요]
# - IAM 서비스 배포의 단일 진입점 (Orchestration Only)
#
# 설계 원칙:
# - main.yml은 "무엇을, 어떤 순서로"만 정의
# - 실제 로직(이미지, containerd, k8s)은 deploy.yml에 위임
# - Secret은 Deployment 이전에 반드시 보장
# ==========================================================


# ----------------------------------------------------------
# (1) IAM DB 접근용 Kubernetes Secret 생성
# ----------------------------------------------------------
# 목적:
# - IAM 서비스가 사용할 DB 접속 정보 사전 주입
#
# 보장 사항:
# - Deployment 적용 이전에 반드시 존재
# - Secret 변경 시 Pod 재기동 트리거 가능
# ----------------------------------------------------------
- name: Create IAM DB access secret
  ansible.builtin.import_tasks: secret_REAL.yml
  run_once: true
  delegate_to: localhost


# ----------------------------------------------------------
# (2) IAM 서비스 배포 (이미지 → containerd → Deployment)
# ----------------------------------------------------------
# 포함 내용 (deploy.yml 내부 책임):
# - containerd socket 탐지
# - 로컬 이미지 존재 확인
# - (필요 시) 이미지 빌드
# - 이미지 tag 정규화 (localhost 제거)
# - containerd(k8s.io) import
# - 이미지 검증 (Fail Fast)
# - 기존 RS / Pod 정리
# - Deployment 적용
# - Pod Ready 대기
# ----------------------------------------------------------
- name: Deploy IAM service and wait until Pod is Ready
  ansible.builtin.import_tasks: deploy.yml
  run_once: true
  delegate_to: localhost

