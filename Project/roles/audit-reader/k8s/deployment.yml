apiVersion: apps/v1
kind: Deployment

metadata:
  name: audit-reader
  labels:
    app: audit-reader

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: audit-reader

  template:
    metadata:
      labels:
        app: audit-reader

    spec:
      serviceAccountName: audit-reader

      containers:
        - name: audit-reader
          image: localhost/audit-reader:0.1.0-onprem
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: SERVICE_PORT
              value: "8080"

            - name: SPRING_PROFILES_ACTIVE
              value: "onprem"

