# ==========================================================
# Role: audit-reader
#
# Guarantees:
# - Namespace 선보장
# - 기존 Deployment 완전 삭제
# - Pod 종료 대기
# - Secret / ConfigMap / Deployment / Service 재생성
# ==========================================================

# ----------------------------------------------------------
# 1. Namespace 보장
# ----------------------------------------------------------
- name: Ensure audit namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ audit_namespace }}"

# ----------------------------------------------------------
# 2. 기존 audit-reader Deployment 제거
# ----------------------------------------------------------
- name: Remove existing audit-reader Deployment if exists
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ audit_reader_deployment_name }}"
    namespace: "{{ audit_namespace }}"
  ignore_errors: true

# ----------------------------------------------------------
# 3. Pod 완전 종료 대기
# ----------------------------------------------------------
- name: Wait for audit-reader pods to terminate
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ audit_namespace }}"
    label_selectors:
      - "app={{ audit_reader_app_label }}"
  register: audit_reader_pods
  until: audit_reader_pods.resources | length == 0
  retries: 20
  delay: 3

# ----------------------------------------------------------
# 4. Secret
# ----------------------------------------------------------
- name: Create audit-reader Secret
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_namespace }}"
    src: "{{ role_path }}/k8s/secret.yml"

# ----------------------------------------------------------
# 5. ConfigMap
# ----------------------------------------------------------
- name: Apply audit-reader ConfigMap
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_namespace }}"
    src: "{{ role_path }}/k8s/configmap.yml"

# ----------------------------------------------------------
# 6. Deployment 재생성
# ----------------------------------------------------------
- name: Deploy audit-reader Deployment
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_namespace }}"
    src: "{{ role_path }}/k8s/deployment.yml"

# ----------------------------------------------------------
# 7. Service
# ----------------------------------------------------------
- name: Deploy audit-reader Service
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_namespace }}"
    src: "{{ role_path }}/k8s/service.yml"

# ----------------------------------------------------------
# 8. Pod Ready 대기
# ----------------------------------------------------------
- name: Wait for audit-reader pod to become Ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ audit_namespace }}"
    label_selectors:
      - "app={{ audit_reader_app_label }}"
  register: audit_reader_ready
  until:
    - audit_reader_ready.resources | length > 0
    - audit_reader_ready.resources[0].status.containerStatuses is defined
    - audit_reader_ready.resources[0].status.containerStatuses[0].ready | default(false)
  retries: 30
  delay: 5

