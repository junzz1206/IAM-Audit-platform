# - Secret / ConfigMap은 Deployment보다 항상 먼저
# ==========================================================


# ----------------------------------------------------------
# 0. Audit Writer 실행 여부 가드
# ----------------------------------------------------------
- name: Check if audit-writer service is enabled
  ansible.builtin.assert:
    that:
      - audit_writer_enabled | default(true) | bool
    fail_msg: "audit_writer_enabled=false 이므로 audit-writer 배포를 중단합니다."
  tags:
    - audit_writer
    - guard


# ----------------------------------------------------------
# 1. 애플리케이션 Namespace 보장
# ----------------------------------------------------------
- name: Ensure application namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ apps_namespace }}"
  delegate_to: localhost
  run_once: true
  tags:
    - audit_writer
    - namespace


# ----------------------------------------------------------
# 2. 🔐 DB Secret 적용 (최우선)
# ----------------------------------------------------------
- name: Apply audit-writer DB Secret
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{
        lookup(
          'template',
          role_path ~ '/k8s/secret.yml'
        )
        | from_yaml
      }}
  delegate_to: localhost
  run_once: true
  tags:
    - audit_writer
    - secret


# ----------------------------------------------------------
# 3. ConfigMap 적용
# ----------------------------------------------------------
- name: Apply audit-writer ConfigMap
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{
        lookup(
          'template',
          role_path ~ '/k8s/configmap.yml'
        )
        | from_yaml
      }}
  delegate_to: localhost
  run_once: true
  tags:
    - audit_writer
    - configmap


# ----------------------------------------------------------
# 4. 🔥 기존 Deployment 강제 제거
#    - strategy 변경 / patch 오류 방지
# ----------------------------------------------------------
- name: Cleanup audit-writer Deployment (force clean)
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: audit-writer
    namespace: "{{ apps_namespace }}"
  delegate_to: localhost
  run_once: true
  ignore_errors: true
  tags:
    - audit_writer
    - cleanup


# ----------------------------------------------------------
# 5. Deployment 재생성 (타입 안전)
# ----------------------------------------------------------
- name: Deploy audit-writer Deployment
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{
        lookup(
          'template',
          role_path ~ '/k8s/deployment.yml'
        )
        | from_yaml
      }}
  delegate_to: localhost
  run_once: true
  tags:
    - audit_writer
    - deployment


# ----------------------------------------------------------
# 6. Pod Ready 대기
# ----------------------------------------------------------
- name: Wait for audit-writer Pod to become Ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ apps_namespace }}"
    label_selectors:
      - "app=audit-writer"
  register: audit_writer_pods
  until:
    - audit_writer_pods.resources | length > 0
    - audit_writer_pods.resources[0].status.containerStatuses is defined
    - audit_writer_pods.resources[0].status.containerStatuses | length > 0
    - audit_writer_pods.resources[0].status.containerStatuses[0].ready | default(false)
  retries: 30
  delay: 5
  delegate_to: localhost
  run_once: true
  tags:
    - audit_writer
    - wait

