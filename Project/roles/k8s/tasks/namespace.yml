---
# ==========================================================
# Kubernetes Namespaces Initialization
# ==========================================================
# 목적:
# - 모든 필수 네임스페이스를 사전에 생성
# - IAM, Apps, Audit, Audit Relay, Monitoring
# - 다른 Role/Deployment 실행 전 반드시 호출
# ==========================================================

# ----------------------------------------------------------
# 1. IAM namespace
# ----------------------------------------------------------
- name: Ensure IAM namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ iam_namespace }}"
  delegate_to: localhost
  run_once: true
  tags:
    - namespace
    - iam

# ----------------------------------------------------------
# 2. Apps namespace
# ----------------------------------------------------------
- name: Ensure Apps namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ apps_namespace }}"
  delegate_to: localhost
  run_once: true
  tags:
    - namespace
    - apps

# ----------------------------------------------------------
# 3. Audit namespace
# ----------------------------------------------------------
- name: Ensure Audit namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ audit_namespace }}"
  delegate_to: localhost
