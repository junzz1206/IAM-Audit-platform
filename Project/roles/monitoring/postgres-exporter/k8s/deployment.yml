# --------------------------------------------------
# PostgreSQL Exporter Deployment
# - PostgreSQL 메트릭 수집 전용
# --------------------------------------------------

apiVersion: apps/v1                       # Deployment API
kind: Deployment                          # Deployment 리소스

metadata:
  name: postgres-exporter                 # Deployment 이름
  namespace: "{{ monitoring_namespace }}" # 네임스페이스
  labels:
    app: postgres-exporter                # 식별 라벨

spec:
  replicas: {{ postgres_exporter_replicas }}   # exporter 파드 수

  selector:
    matchLabels:
      app: postgres-exporter              # 관리 대상 Pod 식별

  template:
    metadata:
      labels:
        app: postgres-exporter            # Pod 라벨

    spec:
      containers:
        - name: postgres-exporter         # 컨테이너 이름

          # ------------------------------------------
          # PostgreSQL Exporter 이미지
          # ------------------------------------------
          image: "{{ postgres_exporter_image }}"
          imagePullPolicy: IfNotPresent   # 로컬/외부 모두 안전

          # ------------------------------------------
          # 메트릭 노출 포트
          # ------------------------------------------
          ports:
            - containerPort: {{ postgres_exporter_port }}
              name: metrics
              protocol: TCP

          # ------------------------------------------
          # 환경 변수 (Secret 참조)
          # ------------------------------------------
          envFrom:
            - secretRef:
                name: "{{ postgres_exporter_secret_name }}"
                # DATA_SOURCE_NAME 자동 로드

          # ------------------------------------------
          # exporter 옵션
          # ------------------------------------------
          args:
            - "--web.listen-address=:{{ postgres_exporter_port }}"
            - "--extend.query-path=/etc/postgres-exporter/queries.yaml"

          # ------------------------------------------
          # 커스텀 쿼리 설정 (선택)
          # ------------------------------------------
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres-exporter
              readOnly: true

          # ------------------------------------------
          # 리소스 제한
          # ------------------------------------------
          resources:
            requests:
              cpu: "{{ postgres_exporter_cpu_request }}"
              memory: "{{ postgres_exporter_memory_request }}"
            limits:
              cpu: "{{ postgres_exporter_cpu_limit }}"
              memory: "{{ postgres_exporter_memory_limit }}"

      # ----------------------------------------------
      # ConfigMap 볼륨 (확장 쿼리용)
      # ----------------------------------------------
      volumes:
        - name: queries
          configMap:
            name: "{{ postgres_exporter_queries_configmap }}"

