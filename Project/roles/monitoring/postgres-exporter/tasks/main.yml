---
# --------------------------------------------------
# PostgreSQL Exporter Role - Main Task
#
# 목적:
# - PostgreSQL 메트릭 수집을 위한 exporter 배포
# - Secret → Service → Deployment 순서 보장
#
# 설계 원칙:
# - 민감 정보는 반드시 Kubernetes Secret 사용
# - Namespace는 role 내부에서 보장
# - Kubernetes API는 localhost에서 호출
# - 여러 번 실행해도 동일 상태 유지 (idempotent)
# --------------------------------------------------

# --------------------------------------------------
# (0) Monitoring Namespace 보장
# --------------------------------------------------
- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: onprem-monitoring
  run_once: true
  delegate_to: localhost

# --------------------------------------------------
# (1) PostgreSQL Exporter Secret 생성
# --------------------------------------------------
- name: Create PostgreSQL Exporter Secret
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/k8s/secret.yml') }}"
  delegate_to: localhost

# --------------------------------------------------
# (2) PostgreSQL Exporter Service 생성
# --------------------------------------------------
- name: Deploy PostgreSQL Exporter Service
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/k8s/service.yml') }}"
  delegate_to: localhost

# --------------------------------------------------
# (3) PostgreSQL Exporter Deployment 생성
# --------------------------------------------------
- name: Deploy PostgreSQL Exporter Deployment
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/k8s/deployment.yml') }}"
  delegate_to: localhost

