# --------------------------------------------------
# Node Exporter Service
# - Prometheus가 접근할 엔드포인트 제공
# --------------------------------------------------

apiVersion: v1                           # Service API 버전
kind: Service                            # Kubernetes Service 리소스

metadata:
  name: node-exporter                    # Service 이름
  namespace: "{{ monitoring_namespace }}"  # 네임스페이스
  labels:
    app: node-exporter                  # 식별용 라벨

spec:
  type: ClusterIP                       # 클러스터 내부 접근용
  selector:
    app: node-exporter                  # DaemonSet Pod 선택

  ports:
    - name: metrics
      port: {{ node_exporter_port }}    # Service 포트
      targetPort: {{ node_exporter_port }}  # Pod 포트
      protocol: TCP

