# --------------------------------------------------
# Node Exporter DaemonSet
# - 모든 Kubernetes 노드에 1개씩 실행
# - 노드 리소스(CPU, Memory, Disk, Network) 메트릭 수집
# --------------------------------------------------

apiVersion: apps/v1                      # DaemonSet이 속한 API 그룹/버전
kind: DaemonSet                         # 모든 노드에 파드를 배포하는 리소스

metadata:
  name: node-exporter                   # DaemonSet 이름
  namespace: "{{ monitoring_namespace }}"  # 배포될 네임스페이스
  labels:
    app: node-exporter                  # 식별용 라벨

spec:
  selector:
    matchLabels:
      app: node-exporter                # 이 라벨을 가진 Pod만 관리

  template:
    metadata:
      labels:
        app: node-exporter              # Pod 라벨

    spec:
      # ----------------------------------------------
      # 호스트 네트워크 사용
      # - 노드의 실제 네트워크 인터페이스 메트릭 수집 목적
      # ----------------------------------------------
      hostNetwork: true
      hostPID: true                     # 프로세스 관련 메트릭 수집 가능

      # ----------------------------------------------
      # 보안 컨텍스트
      # - root 파일시스템 접근 필요
      # ----------------------------------------------
      securityContext:
        runAsUser: 0                    # root 권한으로 실행

      containers:
        - name: node-exporter            # 컨테이너 이름

          # ------------------------------------------
          # Node Exporter 이미지
          # ------------------------------------------
          image: "{{ node_exporter_image }}"

          # ------------------------------------------
          # imagePullPolicy
          # - 로컬 이미지면 IfNotPresent
          # - 외부 레지스트리여도 안전
          # ------------------------------------------
          imagePullPolicy: IfNotPresent

          # ------------------------------------------
          # node-exporter 실행 옵션
          # ------------------------------------------
          args:
            - "--path.procfs=/host/proc" # 호스트 proc 경로 지정
            - "--path.sysfs=/host/sys"   # 호스트 sysfs 경로 지정
            - "--path.rootfs=/host/root" # 호스트 루트 FS
            - "--web.listen-address=:{{ node_exporter_port }}"  # 수신 포트

          ports:
            - containerPort: {{ node_exporter_port }}  # 메트릭 노출 포트
              hostPort: {{ node_exporter_port }}       # 노드 포트와 직접 바인딩
              name: metrics
              protocol: TCP

          # ------------------------------------------
          # 호스트 파일시스템 마운트
          # ------------------------------------------
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true

            - name: sys
              mountPath: /host/sys
              readOnly: true

            - name: root
              mountPath: /host/root
              readOnly: true

          # ------------------------------------------
          # 리소스 사용 제한
          # ------------------------------------------
          resources:
            requests:
              cpu: "{{ node_exporter_cpu_request }}"
              memory: "{{ node_exporter_memory_request }}"
            limits:
              cpu: "{{ node_exporter_cpu_limit }}"
              memory: "{{ node_exporter_memory_limit }}"

      # ----------------------------------------------
      # 볼륨 정의 (호스트 경로)
      # ----------------------------------------------
      volumes:
        - name: proc
          hostPath:
            path: /proc                  # 호스트 /proc

        - name: sys
          hostPath:
            path: /sys                   # 호스트 /sys

        - name: root
          hostPath:
            path: /                      # 호스트 루트 파일시스템

