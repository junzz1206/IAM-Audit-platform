---
# --------------------------------------------------
# Node Exporter Role - Main Task
#
# 목적:
# - Node Exporter 실행을 위한 Kubernetes 리소스 배포
# - Namespace → Service → DaemonSet 순서 보장
#
# 설계 원칙:
# - Namespace는 role 내부에서 보장
# - Kubernetes API 호출은 localhost에서만 수행
# - 여러 번 실행해도 항상 동일 상태 유지 (idempotent)
# --------------------------------------------------

# --------------------------------------------------
# (0) Monitoring Namespace 보장
# --------------------------------------------------
# - node-exporter 및 monitoring 컴포넌트 공용 namespace
# - 이미 존재하면 아무 작업도 하지 않음
- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: onprem-monitoring
  run_once: true                 # Namespace는 한 번만 생성
  delegate_to: localhost         # Kubernetes API는 컨트롤러에서 호출

# --------------------------------------------------
# (1) Node Exporter Service 배포
# --------------------------------------------------
# - Prometheus가 node-exporter Pod를 discover 하기 위한 Service
# - template lookup을 사용해 변수 주입 가능
- name: Deploy Node Exporter Service
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/k8s/service.yml') }}"
  delegate_to: localhost         # Kubernetes API 호출 위치 명시

# --------------------------------------------------
# (2) Node Exporter DaemonSet 배포
# --------------------------------------------------
# - 모든 Kubernetes 노드에 node-exporter Pod 실행
# - 실제 노드 메트릭 수집 담당
- name: Deploy Node Exporter DaemonSet
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', role_path + '/k8s/daemonset.yml') }}"
  delegate_to: localhost         # Kubernetes API 호출 위치 명시

