---
# ==========================================================
# Role: audit-query-api
#
# Purpose:
# - Deploy external-facing audit query API
# - IAM-authenticated read gateway
#
# Guarantees:
# - Namespace 보장
# - ServiceAccount 선행 생성
# - Deployment 완전 제거 후 재생성
# - Secret 변경 시 stale Pod 방지
# ==========================================================

# ----------------------------------------------------------
# 0. 필수 변수 가드
# ----------------------------------------------------------
- name: Ensure required variables are defined
  assert:
    that:
      - audit_namespace is defined
      - audit_namespace | length > 0
    fail_msg: >
      audit_namespace is not defined.
      Define it in inventories/*/group_vars/*.yml

# ----------------------------------------------------------
# 1. Audit Namespace 존재 보장
# ----------------------------------------------------------
- name: Ensure audit namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ audit_namespace }}"
    state: present

# ----------------------------------------------------------
# 2. ServiceAccount 생성 (❗Deployment 이전 필수)
# ----------------------------------------------------------
- name: Deploy audit-query-api ServiceAccount
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_namespace }}"
    definition: "{{ lookup('template', role_path ~ '/k8s/serviceaccount.yml') | from_yaml }}"

# ----------------------------------------------------------
# 3и. 기존 Deployment 제거
# ----------------------------------------------------------
- name: Remove existing audit-query-api Deployment if exists
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: audit-query-api
    namespace: "{{ audit_namespace }}"
  ignore_errors: true

# ----------------------------------------------------------
# 4. Pod 완전 종료 대기
# ----------------------------------------------------------
- name: Wait for audit-query-api pods to terminate
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ audit_namespace }}"
    label_selectors:
      - "app=audit-query-api"
  register: audit_query_api_pods
  until: audit_query_api_pods.resources | length == 0
  retries: 20
  delay: 3

# ----------------------------------------------------------
# 5. Secret 배포
# ----------------------------------------------------------
- name: Deploy audit-query-api Secret
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_namespace }}"
    definition: "{{ lookup('template', role_path ~ '/k8s/secret.yml') | from_yaml }}"

# ----------------------------------------------------------
# 6. Deployment 배포 (렌더링 + 적용)
# ----------------------------------------------------------
- name: Deploy audit-query-api Deployment
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_namespace }}"
    definition: "{{ lookup('template', role_path ~ '/k8s/deployment.yml') | from_yaml }}"

# ----------------------------------------------------------
# 7. Service 배포 (렌더링 + 적용)
# ----------------------------------------------------------
- name: Deploy audit-query-api Service
  kubernetes.core.k8s:
    state: present
    namespace: "{{ audit_namespace }}"
    definition: "{{ lookup('template', role_path ~ '/k8s/service.yml') | from_yaml }}"

