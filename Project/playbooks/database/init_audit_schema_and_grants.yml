---
- name: Initialize database schema, tables, and grants
  hosts: postgres
  become: true
  become_user: postgres

  vars:
    postgres_db: onprem_finance_db
    postgres_role: audit_reader_user
    postgres_role_password: password123
    sql_files:
      - schema.sql
      - ddl.sql
      - dcl.sql
      - dml.sql
    sql_path: "{{ playbook_dir }}/../roles/postgres/files"

  tasks:

    # -----------------------------------------
    # 1. Database 존재 보장
    # -----------------------------------------
    - name: Ensure database exists
      postgresql_db:
        name: "{{ postgres_db }}"
        state: present

    # -----------------------------------------
    # 2. Role 존재 보장
    # -----------------------------------------
    - name: Ensure postgres role exists
      postgresql_user:
        name: "{{ postgres_role }}"
        password: "{{ postgres_role_password }}"
        encrypted: true
        role_attr_flags: LOGIN
        state: present

    # -----------------------------------------
    # 3. SQL 파일 순차 실행
    # -----------------------------------------
    - name: Execute SQL files
      postgresql_query:
        db: "{{ postgres_db }}"
        login_user: postgres
        query: "{{ lookup('file', sql_path + '/' + item) }}"
      loop: "{{ sql_files }}"
      loop_control:
        label: "{{ item }}"

    # -----------------------------------------
    # 4. Role 권한 부여 (스키마 & 테이블)
    # -----------------------------------------
    - name: Grant usage on all schemas
      postgresql_query:
        db: "{{ postgres_db }}"
        query: |
          DO $$
          DECLARE
            r RECORD;
          BEGIN
            FOR r IN SELECT schema_name FROM information_schema.schemata
            LOOP
              EXECUTE format('GRANT USAGE ON SCHEMA %I TO {{ postgres_role }}', r.schema_name);
            END LOOP;
          END $$;

    - name: Grant select on all tables
      postgresql_query:
        db: "{{ postgres_db }}"
        query: |
          DO $$
          DECLARE
            r RECORD;
          BEGIN
            FOR r IN SELECT table_schema, table_name
                     FROM information_schema.tables
                     WHERE table_schema NOT IN ('pg_catalog','information_schema')
            LOOP
              EXECUTE format('GRANT SELECT ON TABLE %I.%I TO {{ postgres_role }}', r.table_schema, r.table_name);
            END LOOP;
          END $$;

    # -----------------------------------------
    # 5. 향후 테이블 자동 권한
    # -----------------------------------------
    - name: Grant default privileges for future tables
      postgresql_query:
        db: "{{ postgres_db }}"
        query: |
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
          GRANT SELECT ON TABLES TO {{ postgres_role }};

