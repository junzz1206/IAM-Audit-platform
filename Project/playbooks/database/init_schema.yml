---
# ==========================================================
# Initialize Database Schema & Tables (DDL)
#
# 역할:
# - 애플리케이션 DB 스키마 + 테이블 초기화
# - PostgreSQL 초기화 포함
# - 최초 1회 또는 명시적 실행만 허용
#
# ⚠️ site.yml 자동 실행 금지
# ==========================================================

- name: Apply DDL schema definitions
  hosts: k8s_control_plane           # Control plane 노드에서 실행
  become: true                       # root 권한으로 실행
  gather_facts: false                # 사실 수집 비활성화

  vars:
    postgres_db_name: "{{ db_name }}"                        # 대상 DB 이름
    postgres_sql_dir: "/opt/sql"                             # SQL 파일 배치 디렉터리 (고정 경로)
    ddl_sql_path: "{{ postgres_sql_dir }}/ddl.sql"           # 서버에 복사될 DDL 경로
    ddl_sql_src: "/root/ansible-rocky9/Project/roles/postgres/files/ddl.sql"  # 소스 DDL 파일 경로
    postgres_data_dir: "/var/lib/pgsql/data"                # PostgreSQL 데이터 디렉터리
    postgres_bin_dir: "/usr/pgsql-15/bin"                   # PostgreSQL 15 바이너리 경로
    postgres_service_name: "postgresql-15"                 # systemd 서비스 이름

  pre_tasks:
    # ------------------------------------------------------
    # 실행 가드: ddl_apply_enabled=false면 실행 중단
    # ------------------------------------------------------
    - name: Ensure DDL apply is explicitly enabled
      assert:
        that:
          - ddl_apply_enabled | bool
        fail_msg: >
          DDL execution is disabled.
          Set ddl_apply_enabled=true to run schema initialization.

  tasks:
    # ------------------------------------------------------
    # 0. OS postgres 사용자 존재 보장
    # ------------------------------------------------------
    - name: Ensure postgres OS user exists
      user:
        name: postgres
        system: yes
        shell: /bin/bash
        create_home: no

    # ------------------------------------------------------
    # 1. PostgreSQL 초기화 (데이터 디렉터리가 없으면 initdb)
    # ------------------------------------------------------
    - name: Initialize PostgreSQL cluster if not exists
      become_user: postgres
      ansible.builtin.shell: |
        if [ ! -s "{{ postgres_data_dir }}/PG_VERSION" ]; then
          "{{ postgres_bin_dir }}/initdb" -D "{{ postgres_data_dir }}"
        fi

    # ------------------------------------------------------
    # 2. PostgreSQL 서비스 시작 및 활성화
    # ------------------------------------------------------
    - name: Ensure PostgreSQL service is running
      systemd:
        name: "{{ postgres_service_name }}"
        state: started
        enabled: yes

    # ------------------------------------------------------
    # 3. Python PostgreSQL 드라이버 보장 (psycopg2)
    # ------------------------------------------------------
    - name: Ensure psycopg2 is installed
      package:
        name: python3-psycopg2
        state: present

    # ------------------------------------------------------
    # 4. SQL 스테이징 디렉터리 생성
    # ------------------------------------------------------
    - name: Ensure SQL directory exists on DB host
      file:
        path: "{{ postgres_sql_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    # ------------------------------------------------------
    # 5. 애플리케이션 DB 존재 보장
    # ------------------------------------------------------
    - name: Ensure application database exists
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ postgres_db_name }}"
        state: present

    # ------------------------------------------------------
    # 6. DDL SQL 파일 배치 (서버에 복사)
    # ------------------------------------------------------
    - name: Copy DDL SQL file to database node
      copy:
        src: "{{ ddl_sql_src }}"
        dest: "{{ ddl_sql_path }}"
        owner: postgres
        group: postgres
        mode: "0600"

    # ------------------------------------------------------
    # 7. DDL 실행 (스키마 + 테이블 + 권한 + 인덱스)
    # ------------------------------------------------------
    - name: Execute DDL SQL file
      become_user: postgres
      ansible.builtin.shell: |
        psql -v ON_ERROR_STOP=1 -d "{{ postgres_db_name }}" -f "{{ ddl_sql_path }}"

