---
# ==========================================================
# Audit Writer Service Deployment Playbook
#
# 역할:
# - 시스템 전반에서 발생한 감사 이벤트를 수집
# - audit.audit_events 테이블에 append-only 방식으로 기록
#
# 설계 원칙:
# - 네임스페이스 값은 SSOT(group_vars/all.yml)만 사용
# - playbook에서 apps_namespace 재정의 금지
# ==========================================================

- name: Deploy Audit Writer Service to On-Premise Kubernetes
  hosts: localhost
  gather_facts: false
  become: false

  tasks:
    # ------------------------------------------------------
    # 1. 애플리케이션 네임스페이스 보장
    # ------------------------------------------------------
    - name: Ensure application namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ apps_namespace }}"
        state: present

    # ------------------------------------------------------
    # 2. Audit Writer Deployment 배포
    # ------------------------------------------------------
    - name: Deploy audit writer service Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ apps_namespace }}"
        template: "{{ playbook_dir }}/../../roles/audit-writer/k8s/deployment.yml"

    # ------------------------------------------------------
    # 3. Audit Writer Pod Ready 대기
    # ------------------------------------------------------
    - name: Wait for audit writer pod to become Ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ apps_namespace }}"
        label_selectors:
          - "app=audit-writer"
      register: audit_writer_pods
      until:
        - audit_writer_pods.resources | length > 0
        - audit_writer_pods.resources[0].status.containerStatuses is defined
        - audit_writer_pods.resources[0].status.containerStatuses[0].ready
      retries: 30
      delay: 5

