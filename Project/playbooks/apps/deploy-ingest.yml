---
# ==========================================================
# CSV Ingest Service Deployment Playbook
#
# 역할:
# - 온프레미스 NFS에 저장된 CSV 파일을 읽음
# - CSV 내용을 finance.card_transactions_raw 테이블에 적재
# - 모든 처리 행위는 audit.audit_events 테이블에 기록
#
# 설계 원칙:
# - Namespace는 SSOT(group_vars/all.yml) 기준
# - src 방식 사용 금지
# - definition + template + from_yaml 방식만 사용
# - 항상 깨끗한 Deployment 상태 보장
# ==========================================================

- name: Deploy CSV Ingest Service to On-Premise Kubernetes
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    ingest_k8s_deployment: "{{ playbook_dir }}/../../roles/ingest-service/k8s/deployment.yml"
    ingest_k8s_service: "{{ playbook_dir }}/../../roles/ingest-service/k8s/service.yml"

  tasks:

    # ------------------------------------------------------
    # 1. 애플리케이션 네임스페이스 보장
    # ------------------------------------------------------
    - name: Ensure application namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ apps_namespace }}"

    # ------------------------------------------------------
    # 2. 🔐 Ingest DB Secret 생성 (🔥 필수)
    # ------------------------------------------------------
    - name: Create ingest DB Secret
      kubernetes.core.k8s:
        state: present
        namespace: "{{ apps_namespace }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ingest-db-secret
          type: Opaque
          stringData:
            password: "{{ ingest_db_password }}"

    # ------------------------------------------------------
    # 3. 🔥 기존 Ingest Deployment 강제 제거
    # ------------------------------------------------------
    - name: Cleanup CSV ingest Deployment (force clean)
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: Deployment
        name: ingest-service
        namespace: "{{ apps_namespace }}"
      ignore_errors: true

    # ------------------------------------------------------
    # 4. CSV Ingest Deployment 배포 (타입 안전)
    # ------------------------------------------------------
    - name: Deploy CSV ingest service Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ apps_namespace }}"
        definition: >-
          {{
            lookup('template', ingest_k8s_deployment)
            | from_yaml
          }}

    # ------------------------------------------------------
    # 5. CSV Ingest Service 배포
    # ------------------------------------------------------
    - name: Deploy CSV ingest service Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ apps_namespace }}"
        definition: >-
          {{
            lookup('template', ingest_k8s_service)
            | from_yaml
          }}

    # ------------------------------------------------------
    # 6. CSV Ingest Pod Ready 대기 (모든 Pod 기준)
    # ------------------------------------------------------
    - name: Wait for all ingest service pods to become Ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ apps_namespace }}"
        label_selectors:
          - "app=ingest-service"
      register: ingest_pods
      until:
        - ingest_pods.resources | length > 0
        - ingest_pods.resources
          | map(attribute='status.containerStatuses')
          | select('defined')
          | map('first')
          | selectattr('ready', 'equalto', true)
          | list
          | length
            ==
            ingest_pods.resources | length
      retries: 30
      delay: 5

