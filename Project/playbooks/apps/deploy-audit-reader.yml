---
# ==========================================================
# Playbook: deploy-audit-reader.yml
# ==========================================================

- name: Deploy audit-reader
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    audit_reader_k8s_dir: "{{ playbook_dir }}/../../roles/audit-reader/k8s"

  tasks:

    # --------------------------------------------------
    # 1. Namespace 보장 (최우선)
    # --------------------------------------------------
    - name: Ensure audit namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ audit_namespace }}"
        state: present

    # --------------------------------------------------
    # 2. 기존 Deployment 제거
    # --------------------------------------------------
    - name: Remove existing audit-reader Deployment if exists
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: Deployment
        name: audit-reader
        namespace: "{{ audit_namespace }}"
      ignore_errors: true

    # --------------------------------------------------
    # 3. Pod 종료 대기
    # --------------------------------------------------
    - name: Wait for audit-reader pods to terminate
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ audit_namespace }}"
        label_selectors:
          - "app=audit-reader"
      register: audit_reader_pods
      until: audit_reader_pods.resources | length == 0
      retries: 20
      delay: 3

    # --------------------------------------------------
    # 4. ServiceAccount
    # --------------------------------------------------
    - name: Deploy audit-reader ServiceAccount
      kubernetes.core.k8s:
        state: present
        namespace: "{{ audit_namespace }}"
        src: "{{ audit_reader_k8s_dir }}/serviceaccount.yml"

    # --------------------------------------------------
    # 5. ConfigMap
    # --------------------------------------------------
    - name: Deploy audit-reader ConfigMap
      kubernetes.core.k8s:
        state: present
        namespace: "{{ audit_namespace }}"
        src: "{{ audit_reader_k8s_dir }}/configmap.yml"

    # --------------------------------------------------
    # 6. Secret
    # --------------------------------------------------
    - name: Deploy audit-reader Secret
      kubernetes.core.k8s:
        state: present
        namespace: "{{ audit_namespace }}"
        src: "{{ audit_reader_k8s_dir }}/secret.yml"

    # --------------------------------------------------
    # 7. Deployment
    # --------------------------------------------------
    - name: Deploy audit-reader Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ audit_namespace }}"
        src: "{{ audit_reader_k8s_dir }}/deployment.yml"

    # --------------------------------------------------
    # 8. Service
    # --------------------------------------------------
    - name: Deploy audit-reader Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ audit_namespace }}"
        src: "{{ audit_reader_k8s_dir }}/service.yml"

    # --------------------------------------------------
    # 9. Ready 대기
    # --------------------------------------------------
    - name: Wait for audit-reader pod to become Ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ audit_namespace }}"
        label_selectors:
          - "app=audit-reader"
      register: audit_reader_ready
      until:
        - audit_reader_ready.resources | length > 0
        - audit_reader_ready.resources[0].status.containerStatuses is defined
        - audit_reader_ready.resources[0].status.containerStatuses[0].ready | default(false)
      retries: 30
      delay: 5

