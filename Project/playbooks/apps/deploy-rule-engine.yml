---
# ==========================================================
# Finance Rule Engine Deployment Playbook
# ==========================================================

- name: Deploy Finance Rule Engine to On-Premise Kubernetes
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    rule_engine_k8s_configmap: "{{ playbook_dir }}/../../roles/finance-rule-engine/k8s/configmap.yml"
    rule_engine_k8s_secret: "{{ playbook_dir }}/../../roles/finance-rule-engine/k8s/secret.yml"
    rule_engine_k8s_deployment: "{{ playbook_dir }}/../../roles/finance-rule-engine/k8s/deployment.yml"

  tasks:

    # ======================================================
    # 1. Namespace 보장
    # ======================================================
    - name: Ensure application namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ apps_namespace }}"

    # ======================================================
    # 2. DB Secret 생성
    # ======================================================
    - name: Create finance rule engine DB secret
      kubernetes.core.k8s:
        state: present
        namespace: "{{ apps_namespace }}"
        definition: >-
          {{
            lookup('template', rule_engine_k8s_secret)
            | from_yaml
          }}

    # ======================================================
    # 3. ConfigMap 배포
    # ======================================================
    - name: Deploy rule engine configuration
      kubernetes.core.k8s:
        state: present
        namespace: "{{ apps_namespace }}"
        definition: >-
          {{
            lookup('template', rule_engine_k8s_configmap)
            | from_yaml
          }}

    # ======================================================
    # 🔥 4. 기존 Deployment 강제 삭제 (핵심)
    # ======================================================
    - name: Delete existing finance rule engine Deployment
      kubernetes.core.k8s:
        state: absent
        kind: Deployment
        name: finance-rule-engine
        namespace: "{{ apps_namespace }}"

    # ======================================================
    # 5. Deployment 재생성
    # ======================================================
    - name: Deploy finance rule engine Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ apps_namespace }}"
        definition: >-
          {{
            lookup('template', rule_engine_k8s_deployment)
            | from_yaml
          }}

    # ======================================================
    # 6. Pod Ready 대기
    # ======================================================
    - name: Wait for rule engine pod to become Ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ apps_namespace }}"
        label_selectors:
          - "app=finance-rule-engine"
      register: rule_engine_pods

      until:
        - rule_engine_pods.resources | length > 0
        - rule_engine_pods.resources[0].status.containerStatuses is defined
        - rule_engine_pods.resources[0].status.containerStatuses | length > 0
        - rule_engine_pods.resources[0].status.containerStatuses[0].ready | default(false)

      retries: 30
      delay: 5

