---
# ==========================================================
# Playbook: gradle-bootstrap.yml
# Purpose:
# - 서버에 JDK 설치 확인
# - Gradle Wrapper를 이용해 Gradle 8.5 자동 다운로드
# - 프로젝트 빌드 수행
# ==========================================================

- name: Bootstrap Gradle and Build Project
  hosts: onprem
  become: yes
  gather_facts: yes

  vars:
    project_dir: /home/team1/Project

  tasks:

    - name: Ensure Java (OpenJDK 17) is installed
      ansible.builtin.package:
        name: java-17-openjdk
        state: present

    - name: Ensure gradlew has execute permission
      ansible.builtin.file:
        path: "{{ project_dir }}/gradlew"
        mode: '0755'

    - name: Run Gradle Wrapper to download Gradle 8.5 and build
      ansible.builtin.command:
        cmd: "./gradlew clean build -x test"
        chdir: "{{ project_dir }}"
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-17-openjdk"   # JDK 경로 맞춰서 필요시 수정
      register: gradle_build
      ignore_errors: false

    - name: Show Gradle build output
      ansible.builtin.debug:
        var: gradle_build.stdout_lines

