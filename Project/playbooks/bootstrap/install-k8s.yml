---
- name: Bootstrap build environment
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # =======================================================
    # 0. Check internet connectivity (Kubernetes repo용)
    # =======================================================
    - name: Check internet connectivity
      ansible.builtin.uri:
        url: https://packages.cloud.google.com
        method: HEAD
        return_content: no
      register: internet_check
      ignore_errors: true

    # =======================================================
    # 1. Install Ansible if missing
    # =======================================================
    - name: Check if Ansible is already installed
      ansible.builtin.command: ansible --version
      register: ansible_check
      ignore_errors: true

    - name: Install Ansible if missing
      import_tasks: bootstrap/install-ansible.yml
      when: ansible_check.rc != 0

    # =======================================================
    # 2. Install Java + Spring Boot if missing
    # =======================================================
    - name: Check if Java is installed
      ansible.builtin.command: java -version
      register: java_check
      ignore_errors: true

    - name: Install Java and Spring Boot if missing
      import_tasks: bootstrap/install-java.yml
      when: java_check.rc != 0

    # =======================================================
    # 3. Install Gradle 8.5 if missing
    # =======================================================
    - name: Check if Gradle 8.5 is installed
      ansible.builtin.command: gradle -v
      register: gradle_check
      ignore_errors: true

    - name: Install Gradle 8.5 if missing
      import_tasks: bootstrap/gradle-bootstrap.yml
      when: gradle_check.rc != 0

    # =======================================================
    # 4. Install Kubernetes only if internet is reachable
    # =======================================================
    - name: Check if kubeadm is installed
      ansible.builtin.command: kubeadm version
      register: kubeadm_check
      ignore_errors: true

    - name: Install Kubernetes if missing and internet is available
      import_tasks: bootstrap/install-k8s.yml
      when:
        - kubeadm_check.rc != 0
        - internet_check is defined
        - internet_check.status == 200

