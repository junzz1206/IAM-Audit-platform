rootProject.name = 'onprem'

/*
 * ==========================================================
 * On-Premise Platform - Gradle Multi Module Settings
 *
 * 원칙
 * - 서비스 1개 = Gradle Subproject 1개
 * - iam / ingest / audit / finance 완전 분리
 * ==========================================================
 */

include(
    "iam",
    "ingest",

    "finance-rule-engine",

    "audit-writer",
    "audit-relay",
    "audit-reader",
    "audit-query-api"
)

/*
 * 디렉토리 명시 (자동화 안정성 확보)
 */

project(":iam").projectDir = file("iam")
project(":ingest").projectDir = file("ingest")

project(":finance-rule-engine").projectDir = file("finance-rule-engine")

project(":audit-writer").projectDir = file("audit-writer")
project(":audit-relay").projectDir = file("audit-relay")
project(":audit-reader").projectDir = file("audit-reader")
project(":audit-query-api").projectDir = file("audit-query-api")

