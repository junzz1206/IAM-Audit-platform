spring:
  application:
    name: finance-rule-engine

  # --------------------------------------------------
  # DataSource (PostgreSQL)
  # 실제 값은 Kubernetes env 로 override 됨
  # --------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onprem_finance_db}
    username: ${DB_USER:finance_engine_user}
    password: ${DB_PASSWORD:password123}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 5000

  # --------------------------------------------------
  # JPA / Hibernate
  # Rule Engine은 스키마/테이블을 "사용만" 함
  # --------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        default_schema: ${DB_FINANCE_SCHEMA:finance}

# --------------------------------------------------
# Rule Engine Domain Settings
# (ConfigMap으로 덮어쓰기 전제)
# --------------------------------------------------
rule-engine:
  mode: ${RULE_ENGINE_MODE:BATCH}          # BATCH | STREAM
  batch-size: ${RULE_EVALUATION_BATCH_SIZE:500}

  finance:
    schema: ${DB_FINANCE_SCHEMA:finance}
    raw-table: ${DB_RAW_TX_TABLE:card_transactions_raw}
    rule-table: ${DB_RULE_TABLE:usage_rules}
    result-table: ${DB_RESULT_TABLE:violation_results}

  audit:
    schema: ${DB_AUDIT_SCHEMA:audit}
    table: ${DB_AUDIT_TABLE:audit_events}

# --------------------------------------------------
# Server
# --------------------------------------------------
server:
  port: ${RULE_ENGINE_PORT:8080}

# --------------------------------------------------
# Logging
# --------------------------------------------------
logging:
  level:
    root: INFO
    com.onprem.finance: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

