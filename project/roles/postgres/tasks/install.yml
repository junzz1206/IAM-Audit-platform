---
# ==========================================================
# PostgreSQL Installation Task (BOOTSTRAP ONLY)
#
# 역할:
# - 기존 PostgreSQL(특히 Rocky 기본) 충돌/포트 점유 자동 정리
# - PGDG Repository 설치
# - PostgreSQL {{ postgres_version }} 설치
# - 최초 1회 initdb
# - PostgreSQL 서비스 enable + start
#
# 주의:
# - postgres_bootstrap_enabled=true 일 때만 실행
# - 운영 DB 환경에서는 절대 사용 금지
# ==========================================================

# ----------------------------------------------------------
# 0. Bootstrap 모드 가드
# ----------------------------------------------------------
- name: Ensure postgres bootstrap mode is enabled
  assert:
    that:
      - postgres_bootstrap_enabled | bool
    fail_msg: >
      PostgreSQL install task must run only in bootstrap mode.
      Set postgres_bootstrap_enabled=true explicitly.
  tags:
    - postgres
    - bootstrap


# ----------------------------------------------------------
# 1. 포트 5432 점유 여부 확인
# ----------------------------------------------------------
- name: Check if port 5432 is in use
  shell: ss -ltnp | grep ':5432' || true
  register: postgres_port_check
  changed_when: false
  tags:
    - postgres
    - cleanup


# ----------------------------------------------------------
# 2. Rocky 기본 PostgreSQL 서비스가 있으면 우선 중지/비활성화
#    (패키지 삭제 전에 systemd 프로세스부터 끊어야 안전)
# ----------------------------------------------------------
- name: Stop and disable Rocky default PostgreSQL service if exists
  systemd:
    name: postgresql
    state: stopped
    enabled: false
  become: true
  failed_when: false
  when: postgres_port_check.stdout != ""
  tags:
    - postgres
    - cleanup


# ----------------------------------------------------------
# 3. PGDG PostgreSQL 설치 여부 확인
#    (이미 PGDG가 설치된 상태면 "삭제/초기화" 같은 파괴 작업 금지)
# ----------------------------------------------------------
- name: Check if PGDG PostgreSQL is already installed
  stat:
    path: "/usr/pgsql-{{ postgres_version }}/bin/postgres"
  register: pgdg_postgres_bin
  tags:
    - postgres
    - cleanup


# ----------------------------------------------------------
# 4. Rocky 기본 PostgreSQL 패키지 제거 (포트 점유 + PGDG 미설치일 때만)
# ----------------------------------------------------------
- name: Remove Rocky default PostgreSQL packages if conflicting
  dnf:
    name:
      - postgresql
      - postgresql-server
      - postgresql-libs
    state: absent
  become: true
  when:
    - postgres_port_check.stdout != ""
    - not pgdg_postgres_bin.stat.exists
  tags:
    - postgres
    - cleanup


# ----------------------------------------------------------
# 5. 깨진 데이터 디렉터리 정리 (중요)
#    - 서비스가 계속 실패하는 가장 흔한 원인이 "깨진 data dir" 잔존
#    - bootstrap + PGDG 미설치일 때만 삭제 허용
# ----------------------------------------------------------
- name: Remove existing PostgreSQL data directory in bootstrap (safe guard)
  file:
    path: "{{ postgres_data_dir }}"
    state: absent
  become: true
  when:
    - postgres_port_check.stdout != ""
    - not pgdg_postgres_bin.stat.exists
  tags:
    - postgres
    - cleanup


# ----------------------------------------------------------
# 6. Rocky Linux 기본 PostgreSQL 모듈 비활성화
# ----------------------------------------------------------
- name: Disable built-in PostgreSQL module (Rocky default)
  command: dnf -qy module disable postgresql
  changed_when: false
  become: true
  tags:
    - postgres
    - bootstrap
    - repo


# ----------------------------------------------------------
# 7. PGDG Repository 설치 (GPG 체크 비활성화: bootstrap 한정)
# ----------------------------------------------------------
- name: Install PGDG repository RPM
  dnf:
    name: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm"
    state: present
    disable_gpg_check: true
  become: true
  tags:
    - postgres
    - bootstrap
    - repo


# ----------------------------------------------------------
# 8. PostgreSQL 서버 패키지 설치 (버전 고정)
# ----------------------------------------------------------
- name: Install PostgreSQL server packages (version pinned)
  dnf:
    name:
      - "postgresql{{ postgres_version }}"
      - "postgresql{{ postgres_version }}-server"
    state: present
  become: true
  tags:
    - postgres
    - bootstrap
    - install


# ----------------------------------------------------------
# 9. PostgreSQL 데이터 디렉터리 초기화 (최초 1회)
#    - postgres_data_dir는 SSOT(all.yml) 기준으로 맞춰져 있어야 함
# ----------------------------------------------------------
- name: Initialize PostgreSQL data directory
  command: >
    /usr/pgsql-{{ postgres_version }}/bin/postgresql-{{ postgres_version }}-setup initdb
  args:
    creates: "{{ postgres_data_dir }}/PG_VERSION"
  become: true
  tags:
    - postgres
    - bootstrap
    - init


# ----------------------------------------------------------
# 10. 데이터 디렉터리 소유권 보정 (권한 꼬임 방지)
# ----------------------------------------------------------
- name: Ensure PostgreSQL data directory ownership
  file:
    path: "/var/lib/pgsql/{{ postgres_version }}"
    owner: postgres
    group: postgres
    recurse: true
  become: true
  tags:
    - postgres
    - bootstrap
    - init


# ----------------------------------------------------------
# 11. PostgreSQL 서비스 enable
# ----------------------------------------------------------
- name: Enable PostgreSQL service
  systemd:
    name: "{{ postgres_service_name }}"   # 예: postgresql-15
    enabled: true
  become: true
  tags:
    - postgres
    - bootstrap
    - service


# ----------------------------------------------------------
# 12. PostgreSQL 서비스 start
# ----------------------------------------------------------
- name: Start PostgreSQL service
  systemd:
    name: "{{ postgres_service_name }}"   # 예: postgresql-15
    state: started
  become: true
  tags:
    - postgres
    - bootstrap
    - service


# ----------------------------------------------------------
# 13. (선택) 기동 확인: 5432 리스닝 확인
# ----------------------------------------------------------
- name: Verify PostgreSQL is listening on {{ db_port }}
  shell: ss -ltnp | grep ':{{ db_port }}' || true
  register: pg_listen_check
  changed_when: false
  tags:
    - postgres
    - bootstrap
    - service

