---
# ==========================================================
# PostgreSQL Schema Initialization Task (DDL)
#
# 역할:
# - 애플리케이션 DB 존재 보장 (CREATE DATABASE)
# - postgresql.conf 적용 (listen_addresses 등)
# - 스키마 / 테이블 / 컬럼(DDL) 최초 구성
#
# 실행 정책:
# - postgres_schema_init_enabled=true 일 때만 실행
# - DDL은 idempotent 전제
# ==========================================================


# ----------------------------------------------------------
# 0. 실행 가드 (명시적 enable 필수)
# ----------------------------------------------------------
- name: Ensure schema init is explicitly enabled
  assert:
    that:
      - postgres_schema_init_enabled | bool
    fail_msg: >
      PostgreSQL schema initialization is disabled.
      Set postgres_schema_init_enabled=true to proceed.
  tags:
    - postgres
    - ddl
    - guard


# ----------------------------------------------------------
# 1. PostgreSQL 서비스 기동 보장
# ----------------------------------------------------------
- name: Ensure PostgreSQL service is running
  systemd:
    name: "{{ postgres_service_name }}"     # ex) postgresql-15
    state: started
  become: true
  tags:
    - postgres
    - service


# ----------------------------------------------------------
# 1.5 postgresql.conf 적용 (🔥 핵심)
# ----------------------------------------------------------
- name: Apply postgresql.conf (runtime config)
  template:
    src: postgresql.conf.j2
    dest: "{{ postgres_data_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  become: true
  tags:
    - postgres
    - config
    - init


# ----------------------------------------------------------
# 1.6 PostgreSQL 재시작 (🔥 반드시 실행)
# ----------------------------------------------------------
- name: Restart PostgreSQL to apply listen_addresses
  systemd:
    name: "{{ postgres_service_name }}"
    state: restarted
  become: true
  tags:
    - postgres
    - config
    - init


# ----------------------------------------------------------
# 2. 애플리케이션 DB 존재 여부 확인
# ----------------------------------------------------------
- name: Check if application database exists
  become_user: postgres
  command: >
    psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ postgres_app_db }}'"
  register: app_db_check
  changed_when: false
  tags:
    - postgres
    - db


# ----------------------------------------------------------
# 3. 애플리케이션 DB 생성 (없을 때만)
# ----------------------------------------------------------
- name: Create application database if missing
  become_user: postgres
  command: >
    createdb {{ postgres_app_db }}
  when: app_db_check.stdout.strip() != "1"
  tags:
    - postgres
    - db


# ----------------------------------------------------------
# 4. SQL 스테이징 디렉터리 보안 보장
# ----------------------------------------------------------
- name: Ensure SQL directory exists on DB host
  file:
    path: "{{ postgres_sql_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  become: true
  tags:
    - postgres
    - filesystem


# ----------------------------------------------------------
# 5. DDL SQL 파일 배포
# ----------------------------------------------------------
- name: Deploy DDL SQL file
  copy:
    src: ddl.sql
    dest: "{{ postgres_sql_dir }}/ddl.sql"
    owner: postgres
    group: postgres
    mode: "0600"
  become: true
  tags:
    - postgres
    - ddl
    - sql


# ----------------------------------------------------------
# 6. DDL SQL 실행 (FAIL-FAST)
# ----------------------------------------------------------
- name: Execute DDL SQL (schema, tables, columns)
  become_user: postgres
  command: >
    /usr/pgsql-{{ postgres_version }}/bin/psql
    -v ON_ERROR_STOP=1
    -d {{ postgres_app_db }}
    -f {{ postgres_sql_dir }}/ddl.sql
  tags:
    - postgres
    - ddl
    - execute

