# ==========================================================
# PostgreSQL Role - Handlers
#
# 역할:
# - 설정 변경 시 PostgreSQL 서비스에 필요한 최소한의 조치만 수행
# - 불필요한 재시작을 방지하고 안정성을 최우선으로 함
#
# 설계 원칙:
# - postgresql.conf 변경 → restart 필요
# - pg_hba.conf 변경 → reload만 필요
# ==========================================================


# ----------------------------------------------------------
# PostgreSQL 서비스 재시작
# ----------------------------------------------------------
- name: Restart PostgreSQL
  # systemd 모듈을 사용해 서비스 제어
  systemd:
    # OS에 등록된 PostgreSQL 서비스 이름
    name: postgresql
    # 서비스 완전 재시작 (프로세스 종료 후 재기동)
    state: restarted
  # root 권한 필요
  become: true
  # postgresql.conf, listen_addresses, shared_buffers 등
  # 프로세스 재기동이 필요한 설정 변경 시에만 호출됨


# ----------------------------------------------------------
# PostgreSQL 설정 리로드 (무중단)
# ----------------------------------------------------------
- name: Reload PostgreSQL
  # systemd reload는 PostgreSQL에 SIGHUP을 전달
  systemd:
    # PostgreSQL 서비스 이름
    name: "{{ postgres_service_name }}"
    # 프로세스는 유지한 채 설정만 다시 읽음
    state: reloaded
  # root 권한 필요
  become: true
  # pg_hba.conf, pg_ident.conf 등
  # 인증/접근 제어 변경 시 사용
  # 기존 커넥션은 유지되고 신규 커넥션부터 적용됨

