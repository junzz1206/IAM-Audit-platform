---
# ==========================================================
# ZERO TRUST FIREWALL RULESET (ON-PREMISE)
# Default: DROP ALL
# ==========================================================

# -------------------------------
# 1. Global Base Policy
# -------------------------------
- name: Set default zone to drop
  ansible.builtin.command: firewall-cmd --set-default-zone=drop
  changed_when: false

- name: Allow loopback
  ansible.builtin.firewalld:
    interface: lo
    zone: trusted
    permanent: true
    state: enabled
    immediate: true

- name: Allow established / related traffic
  ansible.builtin.firewalld:
    rich_rule: 'rule family=ipv4 ct state=established,related accept'
    permanent: true
    state: enabled
    immediate: true

# -------------------------------
# 2. SSH (관리자 접근)
# -------------------------------
- name: Allow SSH from admin network only
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ onprem_admin_cidr | default("192.168.1.0/24") }}
      service name=ssh
      accept
    permanent: true
    state: enabled
    immediate: true

# -------------------------------
# 3. Kubernetes Control Plane
# -------------------------------
- name: Allow Kubernetes API Server
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ k8s_node_cidr | default("192.168.1.0/24") }}
      port protocol=tcp port=6443
      accept
    permanent: true
    state: enabled
    immediate: true

- name: Allow kubelet
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ k8s_node_cidr | default("192.168.1.0/24") }}
      port protocol=tcp port=10250
      accept
    permanent: true
    state: enabled
    immediate: true

# -------------------------------
# 4. Pod / Service Network
# -------------------------------
- name: Allow Pod-to-Pod traffic
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ k8s_pod_cidr | default("10.244.0.0/16") }}
      accept
    permanent: true
    state: enabled
    immediate: true

- name: Allow Service CIDR
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ k8s_service_cidr | default("10.96.0.0/12") }}
      accept
    permanent: true
    state: enabled
    immediate: true

# -------------------------------
# 5. Applications (NodePort 최소 허용)
# -------------------------------
- name: Allow NodePort range (internal only)
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ onprem_network_cidr | default("192.168.1.0/24") }}
      port protocol=tcp port=30000-32767
      accept
    permanent: true
    state: enabled
    immediate: true

# -------------------------------
# 6. Database (PostgreSQL)
# -------------------------------
- name: Allow PostgreSQL from K8s Pods only
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ k8s_pod_cidr | default("10.244.0.0/16") }}
      port protocol=tcp port=5432
      accept
    permanent: true
    state: enabled
    immediate: true

# -------------------------------
# 7. Monitoring
# -------------------------------
- name: Allow Prometheus scrape
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ monitoring_cidr | default("192.168.1.0/24") }}
      port protocol=tcp port=9090
      accept
    permanent: true
    state: enabled
    immediate: true

- name: Allow Node Exporter
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ monitoring_cidr | default("192.168.1.0/24") }}
      port protocol=tcp port=9100
      accept
    permanent: true
    state: enabled
    immediate: true

# -------------------------------
# 8. Storage (NFS)
# -------------------------------
- name: Allow NFS from nodes and pods
  ansible.builtin.firewalld:
    rich_rule: >
      rule family=ipv4
      source address={{ k8s_node_cidr | default("192.168.1.0/24") }}
      port protocol=tcp port=2049
      accept
    permanent: true
    state: enabled
    immediate: true

# -------------------------------
# 9. Final reload
# -------------------------------
- name: Reload firewall
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false

