---
# ==========================================================
# NFS Role - Kubernetes Storage Tasks
#
# 목적:
# - NFS 기반 PersistentVolume 생성
# - PersistentVolumeClaim 생성
#
# 설계 원칙:
# - PV는 cluster-scoped (namespace 없음)
# - PVC는 apps_namespace 에 생성
# - 명시적 PV ↔ PVC 바인딩
# - 멱등성 보장
# - Kubernetes API 호출은 localhost에서만 수행
# - Control Plane 수와 무관하게 1회만 실행
# ==========================================================


# ----------------------------------------------------------
# (1) PersistentVolume 생성
# ----------------------------------------------------------
- name: Create NFS PersistentVolume
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: "{{ nfs_pv_name }}"
      spec:
        capacity:
          storage: "{{ nfs_storage_size }}"
        accessModes:
          - ReadWriteMany
        persistentVolumeReclaimPolicy: Retain
        nfs:
          server: "{{ nfs_server }}"
          path: "{{ nfs_pv_path }}"
  delegate_to: localhost
  run_once: true
  tags:
    - nfs
    - pv


# ----------------------------------------------------------
# (2) PersistentVolumeClaim 생성
# ----------------------------------------------------------
- name: Create NFS PersistentVolumeClaim
  kubernetes.core.k8s:
    state: present
    namespace: "{{ nfs_pvc_namespace }}"
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ nfs_pvc_name }}"
      spec:
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: "{{ nfs_storage_size }}"
        volumeName: "{{ nfs_pv_name }}"
  delegate_to: localhost
  run_once: true
  tags:
    - nfs
    - pvc

