---
# ==========================================================
# NFS Role - Main Task
#
# 목적:
# - NFS 서버(OS 레벨) 구성
# - Kubernetes 스토리지 리소스(PV / PVC) 생성
#
# 설계 원칙:
# - storage_type == nfs 일 때만 실행
# - OS 레벨 → Kubernetes 레벨 순서 보장
# - Kubernetes API 호출은 반드시 localhost에서 수행
# ==========================================================


# ----------------------------------------------------------
# (0) 사전 조건 검증
# ----------------------------------------------------------
- name: Validate NFS role prerequisites
  ansible.builtin.assert:
    that:
      - storage_type == "nfs"
      - nfs_enabled | bool
    fail_msg: >
      NFS role prerequisites not met.
      storage_type={{ storage_type }},
      nfs_enabled={{ nfs_enabled }}


# ----------------------------------------------------------
# (1) NFS 서버 OS 레벨 구성
#     - 패키지 설치
#     - exports 설정
#     - 서비스 기동
# ----------------------------------------------------------
- name: Configure NFS server (OS level)
  ansible.builtin.include_tasks: os.yml
  when:
    - inventory_hostname == k8s_node_host
  tags:
    - nfs
    - os


# ----------------------------------------------------------
# (2) Kubernetes 스토리지 리소스 구성
#     - PersistentVolume
#     - PersistentVolumeClaim
#
# ⚠️ 반드시 localhost에서 실행
# ----------------------------------------------------------
- name: Configure Kubernetes storage (PV / PVC)
  ansible.builtin.include_tasks: k8s.yml
  when:
    - kubernetes_enabled | default(true) | bool
  tags:
    - nfs
    - k8s

