apiVersion: v1
kind: ConfigMap
metadata:
  name: iam-service-config
  namespace: onprem-iam
  labels:
    app: iam-service

data:
  # =====================================
  # Spring
  # =====================================
  SPRING_PROFILES_ACTIVE: "onprem"
  SERVER_PORT: "8080"
  TZ: "Asia/Seoul"

  # =====================================
  # Database (IAM)
  # =====================================
  DB_HOST: "192.168.1.151"
  DB_PORT: "5432"
  DB_NAME: "onprem_iam_db"
  DB_SCHEMA: "iam"

  # =====================================
  # JPA / Hibernate
  # =====================================
  JPA_DDL_AUTO: "validate"
  JPA_SHOW_SQL: "false"

  # =====================================
  # Security / JWT
  # =====================================
  JWT_ISSUER: "onprem-iam"
  JWT_EXPIRE_SECONDS: "3600"

