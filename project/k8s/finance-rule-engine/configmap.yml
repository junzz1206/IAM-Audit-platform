apiVersion: v1
kind: ConfigMap
metadata:
  name: finance-rule-engine-config
  namespace: onprem-apps
  labels:
    app: finance-rule-engine

data:
  # ----------------------------------------------------------
  # Database schema definitions (MUST MATCH DDL)
  # ----------------------------------------------------------
  DB_FINANCE_SCHEMA: "finance"
  DB_AUDIT_SCHEMA: "audit"

  DB_RAW_TX_TABLE: "card_transactions_raw"
  DB_RULE_TABLE: "usage_rules"
  DB_RESULT_TABLE: "violation_results"
  DB_AUDIT_TABLE: "audit_events"

  # ----------------------------------------------------------
  # Rule engine execution mode
  # ----------------------------------------------------------
  # strict   : 위반 시 is_violation=true, 결과 DB/Audit 기록
  # dry-run  : 위반 판단은 하되 DB에는 기록하지 않음 (테스트)
  RULE_ENGINE_MODE: "strict"

  # ----------------------------------------------------------
  # Processing / Performance
  # ----------------------------------------------------------
  RULE_EVALUATION_BATCH_SIZE: "100"

  # ----------------------------------------------------------
  # Violation & Severity semantics (🔥 핵심 추가)
  # ----------------------------------------------------------
  # Rule Engine만이 severity를 "결정"한다.
  # DB / audit-relay / audit-reader는 이 값을 절대 재계산하지 않는다.

  # 위반 여부 필드명 (DDL과 반드시 일치)
  RESULT_VIOLATION_FIELD: "is_violation"

  # 심각도 필드명 (DDL과 반드시 일치)
  RESULT_SEVERITY_FIELD: "severity"

  # ----------------------------------------------------------
  # Severity levels (의미적 등급)
  # ----------------------------------------------------------
  # 0 = INFO       (정상 또는 참고)
  # 1 = LOW        (경미한 위반)
  # 2 = MEDIUM     (주의 필요)
  # 3 = HIGH       (즉각 조치 필요)
  # 4 = CRITICAL   (중대 사고)
  SEVERITY_INFO: "0"
  SEVERITY_LOW: "1"
  SEVERITY_MEDIUM: "2"
  SEVERITY_HIGH: "3"
  SEVERITY_CRITICAL: "4"

  # ----------------------------------------------------------
  # Default severity (rule에 명시되지 않은 경우)
  # ----------------------------------------------------------
  DEFAULT_VIOLATION_SEVERITY: "2"   # MEDIUM

