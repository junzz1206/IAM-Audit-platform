---
# ==========================================================
# PostgreSQL Role & Privilege Task (DCL)
#
# 역할:
# - NOLOGIN ROLE 생성
# - GRANT / DEFAULT PRIVILEGES 적용
#
# ⚠️ 운영 중 자동 실행 금지
# ⚠️ 명시적 실행만 허용
# ==========================================================

- name: Apply PostgreSQL roles and privileges (DCL)
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  vars:
    postgres_db_name: "{{ db_name }}"
    postgres_sql_dir: "{{ postgres_sql_dir | default('/opt/sql') }}"
    dcl_sql_path: "{{ postgres_sql_dir }}/dcl.sql"

  pre_tasks:
    # ------------------------------------------------------
    # 실행 가드 (🔥 필수)
    # ------------------------------------------------------
    - name: Ensure DCL apply is explicitly enabled
      assert:
        that:
          - dcl_apply_enabled | bool
        fail_msg: >
          DCL execution is disabled.
          Set dcl_apply_enabled=true to apply DB roles and privileges.

  tasks:
    # ------------------------------------------------------
    # 0. PostgreSQL 서비스 실행 보장
    # ------------------------------------------------------
    - name: Ensure PostgreSQL service is running
      systemd:
        name: postgresql
        state: started

    # ------------------------------------------------------
    # 1. Python PostgreSQL 드라이버 보장
    # ------------------------------------------------------
    - name: Ensure psycopg2 is installed
      package:
        name: python3-psycopg2
        state: present

    # ------------------------------------------------------
    # 2. SQL 스테이징 디렉터리 보장
    # ------------------------------------------------------
    - name: Ensure SQL directory exists on DB host
      file:
        path: "{{ postgres_sql_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    # ------------------------------------------------------
    # 3. DCL SQL 파일 배치
    # ------------------------------------------------------
    - name: Copy DCL SQL file to database host
      copy:
        src: files/dcl.sql
        dest: "{{ dcl_sql_path }}"
        owner: postgres
        group: postgres
        mode: "0600"

    # ------------------------------------------------------
    # 4. DCL 실행 (roles / grants)
    # ------------------------------------------------------
    - name: Execute DCL SQL file
      become_user: postgres
      command: >
        psql -d {{ postgres_db_name }} -f {{ dcl_sql_path }}

