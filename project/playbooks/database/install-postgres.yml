---
# ==========================================================
# PostgreSQL Bootstrap Playbook (INITIAL RUN ONLY)
#
# 역할:
# - PostgreSQL OS 패키지 설치
# - PGDG 기반 initdb 수행
# - PostgreSQL 서비스 enable + start
#
# ⚠️ 주의:
# - site.yml 포함 ❌
# - 운영 환경에서 재실행 절대 금지
# - 반드시 명시적으로만 실행
# ==========================================================

- name: Bootstrap PostgreSQL on on-prem server (ONE-TIME)
  hosts: k8s_control_plane        # DB 전용 노드 분리 시 db 그룹으로 변경
  become: true
  gather_facts: true

  vars:
    # ------------------------------------------------------
    # Bootstrap 전용 가드 (role과 100% 일치)
    # ------------------------------------------------------
    postgres_bootstrap_enabled: true
    postgres_schema_init_enabled: false
    postgres_roles_apply_enabled: false

  pre_tasks:
    # ------------------------------------------------------
    # 최종 안전 가드
    # ------------------------------------------------------
    - name: Ensure PostgreSQL bootstrap is explicitly enabled
      assert:
        that:
          - postgres_bootstrap_enabled | bool
        fail_msg: >
          PostgreSQL bootstrap playbook is disabled.
          This playbook must only be executed intentionally.

  tasks:
    # ------------------------------------------------------
    # PostgreSQL 설치 / initdb / 서비스 기동
    # ------------------------------------------------------
    - name: Run PostgreSQL bootstrap via postgres role
      include_role:
        name: postgres
      tags:
        - postgres
        - bootstrap

