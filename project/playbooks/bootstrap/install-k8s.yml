---
- name: Bootstrap build environment
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # =======================================================
    # 0. Disable Kubernetes repo globally (존재 시에만 의미)
    # =======================================================
    - name: Disable kubernetes repo during bootstrap
      ansible.builtin.command: dnf config-manager --set-disabled kubernetes
      ignore_errors: true
      changed_when: false
      # kubernetes repo가 없는 경우가 정상인 환경(AWS RHEL) 고려


    # =======================================================
    # 1. Check internet connectivity (DNS + TCP level)  ✅ FIX
    # =======================================================
    - name: Check internet connectivity (TCP 443)
      ansible.builtin.wait_for:
        host: packages.cloud.google.com
        port: 443
        timeout: 5
      register: internet_check
      ignore_errors: true
      # HTTP status (200/404) 보지 않음
      # DNS 해석 + TCP 연결 가능 여부만 확인


    - name: Show internet connectivity result
      ansible.builtin.debug:
        msg: >
          Internet connectivity check:
          {{ 'OK' if internet_check is succeeded else 'FAILED (ignored)' }}


    # =======================================================
    # 2. Java & build dependencies 설치
    # =======================================================
    - name: Install Java & build dependencies
      ansible.builtin.dnf:
        name:
          - java-17-openjdk
          - java-17-openjdk-devel
          - git
          - unzip
        state: present
      # Kubernetes 설치 전 필수 빌드/런타임 의존성


    # =======================================================
    # 3. JAVA_HOME 설정
    # =======================================================
    - name: Ensure JAVA_HOME environment variable is set
      ansible.builtin.lineinfile:
        path: /etc/profile.d/java.sh
        line: 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk'
        create: yes
        state: present
        mode: '0644'


    # =======================================================
    # 4. PATH에 JAVA_HOME/bin 추가
    # =======================================================
    - name: Ensure JAVA_HOME bin is in PATH
      ansible.builtin.lineinfile:
        path: /etc/profile.d/java.sh
        line: 'export PATH=$JAVA_HOME/bin:$PATH'
        create: yes
        state: present
        mode: '0644'

