# ==========================================================
# src/main/resources/application.yml
# (IAM Service / Spring Boot 3.x)
# ==========================================================

spring:
  application:
    name: iam-service

  profiles:
    active: onprem

  # --------------------------------------------------------
  # Datasource (PostgreSQL)
  # --------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      initialization-fail-timeout: -1

# ----------------------------------------------------------
# Actuator / Health / Kubernetes Probes
# ----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,liveness,readiness

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true

# ----------------------------------------------------------
# Server
# ----------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}

